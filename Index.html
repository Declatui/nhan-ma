<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhận Mã Code Xác Thực</title>
    <style>
        body { 
            background: #0f172a; 
            color: #f8fafc; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            padding-top: 80px; 
            margin: 0;
        }
        .box { 
            background: #1e293b; 
            padding: 30px; 
            border-radius: 12px; 
            display: inline-block; 
            width: 90%; 
            max-width: 380px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        input { 
            padding: 12px; 
            width: 85%; 
            border-radius: 8px; 
            border: 1px solid #334155; 
            background: #0f172a; 
            color: white; 
            font-size: 16px; 
            text-align: center; 
            margin: 15px 0; 
            outline: none;
        }
        button { 
            padding: 12px 20px; 
            background: #38bdf8; 
            border: none; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            width: 90%; 
            font-size: 16px; 
            color: #0f172a;
            transition: 0.2s;
        }
        button:hover { background: #0ea5e9; }
        .result { 
            margin-top: 25px; 
            font-size: 26px; 
            color: #38bdf8; 
            font-weight: bold; 
            letter-spacing: 1px;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>🎉 Vượt Link Thành Công!</h2>
        <p>Nhập tên Discord của bạn để lấy mã:</p>
        <input type="text" id="username" placeholder="Ví dụ: username_cua_ban">
        <br>
        <button onclick="layCode()">Xem Mã Code</button>
        <div class="result" id="hienThiCode">---</div>
    </div>

    <script>
        // Link API Render của bạn đã được gắn sẵn vào đây:
        const LINK_API = "https://api-code-bot.onrender.com";

        async function layCode() {
            let ten = document.getElementById("username").value.trim();
            if(!ten) { 
                alert("Vui lòng nhập tên Discord của bạn!"); 
                return; 
            }

            let khung = document.getElementById("hienThiCode");
            khung.innerText = "Đang tìm...";

            try {
                let res = await fetch(`${LINK_API}/get-code?username=${encodeURIComponent(ten)}`);
                let data = await res.json();

                if(data.code) {
                    khung.innerText = data.code; // Mã code hiện ra đây, không lộ trên URL!
                } else {
                    khung.innerText = "Không tìm thấy mã hoặc chưa tạo lệnh lấy link!";
                }
            } catch(e) {
                khung.innerText = "Lỗi kết nối tới máy chủ!";
            }
        }
    </script>
</body>
</html>
