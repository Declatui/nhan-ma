<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Thực Nhận Coin - to by ph.huyy</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0f172a; color: #fff; text-align: center; padding-top: 50px; }
        .box { background: #1e293b; padding: 30px; border-radius: 12px; display: inline-block; max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); margin: 20px; }
        h1 { color: #38bdf8; font-size: 22px; }
        .avatar { width: 85px; height: 85px; border-radius: 50%; border: 3px solid #38bdf8; margin-bottom: 15px; object-fit: cover; box-shadow: 0 0 12px rgba(56, 189, 248, 0.4); }
        .time-box { margin-top: 15px; font-size: 14px; color: #38bdf8; background: #0f172a; padding: 8px; border-radius: 6px; display: inline-block; }
        .footer { margin-top: 20px; font-size: 13px; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="box" id="content">
        <!-- Hiển thị Avatar GIF Discord của bạn -->
        <img src="https://cdn.discordapp.com/avatars/1180179460339810314/default.png" alt="Avatar" class="avatar" id="user-avatar" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'">
        
        <h1>⏳ Đang xác thực hệ thống...</h1>
        <p>Vui lòng chờ trong giây lát trong lúc hệ thống ghi nhận kết quả.</p>
        <div class="time-box" id="vietnam-time">🕒 Giờ hệ thống: Đang tải...</div>
    </div>

    <div class="footer">
        Được phát triển bởi <b>to by ph.huyy</b> (Vĩnh Phúc, VN)
    </div>

    <script>
        // Tự động check và load đúng định dạng GIF từ Discord API
        fetch('https://discord.com/api/v10/users/1180179460339810314')
            .then(res => res.json())
            .then(data => {
                if(data && data.avatar) {
                    // Nếu avatar bắt đầu bằng 'a_' thì chắc chắn là file GIF động
                    const ext = data.avatar.startsWith('a_') ? 'gif' : 'png';
                    document.getElementById('user-avatar').src = `https://cdn.discordapp.com/avatars/1180179460339810314/${data.avatar}.${ext}?size=256`;
                }
            })
            .catch(err => console.log("Không tải được thông tin avatar Discord"));

        // Hàm cập nhật đồng hồ theo giờ Việt Nam (Asia/Ho_Chi_Minh)
        function updateVietnamTime() {
            const options = {
                timeZone: 'Asia/Ho_Chi_Minh',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour12: false
            };
            const formatter = new Intl.DateTimeFormat([], options);
            const timeString = formatter.format(new Date());
            const timeElements = document.querySelectorAll('#vietnam-time');
            timeElements.forEach(el => {
                el.innerText = `🕒 Giờ VN: ${timeString}`;
            });
        }

        // Chạy ngay lập tức và cập nhật mỗi giây
        updateVietnamTime();
        setInterval(updateVietnamTime, 1000);

        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('user');
        
        const boxContent = document.getElementById('content');

        if (!userId) {
            boxContent.innerHTML = "<h1>⚠️ Lỗi Liên Kết</h1><p>Không tìm thấy thông tin định danh người dùng trong đường dẫn.</p>";
        } else {
            // Thay thế bằng link Backend thực tế của bạn (Ví dụ: Railway, Render, v.v. không có dấu / ở cuối)
            const apiRailwayUrl = "https://cay-coin-production.up.railway.app";

            fetch(`${apiRailwayUrl}/complete?user_id=${userId}`)
                .then(response => response.text())
                .then(data => {
                    // Giữ lại đúng link avatar GIF hiện tại khi nội dung trang thay đổi thành công
                    const avatarSrc = document.getElementById('user-avatar').src;
                    boxContent.innerHTML = `<img src="${avatarSrc}" alt="Avatar" class="avatar">` + data + `<br><div class="time-box" id="vietnam-time" style="margin-top:15px;">🕒 Giờ VN: Đang tải...</div>`;
                })
                .catch(error => {
                    console.error("Lỗi kết nối:", error);
                    boxContent.innerHTML = "<h1>❌ Lỗi kết nối đến máy chủ!</h1>";
                });
        }
    </script>
</body>
</html>
