<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Thực Nhận Coin - ph.huyy</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0f172a; color: #fff; text-align: center; padding-top: 50px; }
        .box { background: #1e293b; padding: 30px; border-radius: 12px; display: inline-block; max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); margin: 20px; }
        h1 { color: #38bdf8; font-size: 22px; }
        .footer { margin-top: 20px; font-size: 13px; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="box" id="content">
        <h1>⏳ Đang xác thực hệ thống...</h1>
        <p>Vui lòng chờ trong giây lát trong lúc hệ thống ghi nhận kết quả.</p>
    </div>

    <div class="footer">
        Được phát triển bởi <b>ph.huyy</b> (Vĩnh Phúc, VN)
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('user');
        
        const boxContent = document.getElementById('content');

        if (!userId) {
            boxContent.innerHTML = "<h1>⚠️ Lỗi Liên Kết</h1><p>Không tìm thấy thông tin định danh người dùng trong đường dẫn.</p>";
        } else {
            // Thay thế bằng đường dẫn URL Railway thực tế của bạn (không có dấu / ở cuối)
            const apiRailwayUrl = "https://cay-coin-production.up.railway.app";

            fetch(`${apiRailwayUrl}/complete?user_id=${userId}`)
                .then(response => response.text())
                .then(data => {
                    boxContent.innerHTML = data; 
                })
                .catch(error => {
                    console.error("Lỗi kết nối:", error);
                    boxContent.innerHTML = "<h1>❌ Lỗi kết nối đến máy chủ!</h1>";
                });
        }
    </script>
</body>
</html>
