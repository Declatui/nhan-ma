<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Nhận Vượt Link - Nhận Coin Thành Công</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }
        .card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 420px;
            width: 90%;
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .spinner {
            margin: 20px auto;
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #48bb78;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .icon-success {
            font-size: 50px;
            margin-bottom: 10px;
            animation: bounce 0.6s ease infinite alternate;
        }
        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-8px); }
        }
        h1 {
            color: #2d3748;
            font-size: 22px;
            margin-bottom: 12px;
        }
        p {
            color: #718096;
            font-size: 14px;
            line-height: 1.5;
        }
        .coin-badge {
            display: inline-block;
            background: #feebc8;
            color: #dd6b20;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 15px;
            margin-top: 15px;
        }
        .error {
            color: #e53e3e !important;
        }
    </style>
</head>
<body>
    <div class="card" id="card-box">
        <div id="loader" class="spinner"></div>
        <h1 id="title">Đang xác thực vượt link...</h1>
        <p id="desc">Hệ thống đang kiểm tra lượt vượt link của bạn, vui lòng đợi trong giây lát.</p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('user');

        if (userId) {
            // Thay đường dẫn domain Railway của bạn vào đây
            const RAILWAY_DOMAIN = "https://web-production-xxxx.up.railway.app";

            // Giả lập thời gian ngắn để hiện thông báo chúc mừng mượt mà trước khi gọi API hoàn thành
            setTimeout(() => {
                document.getElementById("loader").style.display = "none";
                const cardBox = document.getElementById("card-box");
                
                cardBox.insertAdjacentHTML('afterbegin', '<div class="icon-success">🎉</div>');
                document.getElementById("title").innerText = "Vượt Link Thành Công!";
                document.getElementById("desc").innerHTML = "Chúc mừng bạn đã hoàn thành nhiệm vụ.<br>Hệ thống đang gửi phần thưởng về Discord!";
                
                // Thêm huy hiệu nhận coin cho sinh động
                cardBox.insertAdjacentHTML('beforeend', '<div class="coin-badge">🪙 +100 Coin Đã Được Ghi Nhận</div>');

                // Sau 2 giây tiếp theo mới chuyển hướng về server Flask trên Railway để cộng điểm
                setTimeout(() => {
                    window.location.href = `${RAILWAY_DOMAIN}/complete?user_id=${userId}`;
                }, 2000);

            }, 1200); 

        } else {
            document.getElementById("loader").style.display = "none";
            const titleEl = document.getElementById("title");
            const descEl = document.getElementById("desc");
            
            titleEl.classList.add("error");
            titleEl.innerText = "❌ Thiếu thông tin người dùng!";
            descEl.innerText = "Đường dẫn không hợp lệ hoặc thiếu tham số xác thực từ bot.";
        }
    </script>
</body>
    </html>
