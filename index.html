<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Nhận Vượt Link</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
        .container { background: white; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        h1 { color: #28a745; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎉 Đang xác thực vượt link...</h1>
        <p>Vui lòng chờ trong giây lát, hệ thống đang kết nối với bot Discord...</p>
    </div>

    <script>
        // Lấy user_id từ URL (ví dụ: ?user=123456789)
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('user');

        if (userId) {
            // Đã gắn domain Render của bạn vào đây
            const RENDER_DOMAIN = "https://api-code-bot.onrender.com";

            // Tự động chuyển hướng sang API hoàn thành của bot trên Render
            window.location.href = `${RENDER_DOMAIN}/complete?user_id=${userId}`;
        } else {
            document.querySelector("h1").style.color = "red";
            document.querySelector("h1").innerText = "❌ Lỗi: Không tìm thấy thông tin người dùng!";
            document.querySelector("p").innerText = "Đường dẫn không hợp lệ hoặc thiếu tham số user.";
        }
    </script>
</body>
</html>
