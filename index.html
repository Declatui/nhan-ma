<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Thực Vượt Link</title>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: sans-serif; text-align: center; padding-top: 100px; }
        .box { background: #1e293b; padding: 40px; border-radius: 12px; display: inline-block; max-width: 400px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h2 { color: #38bdf8; }
    </style>
</head>
<body>
    <div class="box" id="content">
        <h2>⏳ Đang xác thực...</h2>
        <p>Vui lòng đợi trong giây lát hệ thống đang ghi nhận kết quả!</p>
    </div>

    <script>
        const LINK_API = "https://api-code-bot.onrender.com";

        async function verify() {
            const urlParams = new URLSearchParams(window.location.search);
            const userId = urlParams.get('user');

            if (!userId) {
                document.getElementById("content").innerHTML = "<h2>❌ Lỗi!</h2><p>Đường dẫn không hợp lệ.</p>";
                return;
            }

            try {
                let res = await fetch(`${LINK_API}/complete?user_id=${userId}`);
                if (res.ok) {
                    document.getElementById("content").innerHTML = "<h2>🎉 Thành Công!</h2><p>Đã xác thực vượt link thành công! Bạn hãy quay lại Discord để nhận coin nhé.</p>";
                }
            } catch (e) {
                document.getElementById("content").innerHTML = "<h2>⚠️ Lỗi kết nối!</h2><p>Không thể kết nối đến máy chủ xác thực.</p>";
            }
        }

        verify();
    </script>
</body>
</html>
